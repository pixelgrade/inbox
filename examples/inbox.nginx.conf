server {
    listen 443 ssl;
    server_name inbox.example.org;
    ssl_certificate /etc/nginx/tls/inbox.crt;
    ssl_certificate_key /etc/nginx/tls/inbox.key;
    client_max_body_size 32m;

    location / {
        proxy_pass http://127.0.0.1:8926;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
    }
}
