{% extends "layout.html" %}{% block title %}New conversation{% endblock %}{% block main %}
<a href="/">← Inbox</a><h1>New conversation</h1><form class="stack" enctype="multipart/form-data" method="post"><input type="hidden" name="operation" value="{{operation}}">
<label for="email">Customer email</label><input type="email" id="email" name="email" required><label for="subject">Subject</label><input id="subject" name="subject" required maxlength="2000">
<label for="body">Message</label><textarea rows="9" id="body" name="body" required></textarea><details><summary>Format, copies and attachments</summary><label for="format">Message format</label><select id="format" name="format"><option value="text">Plain text</option><option value="html">HTML</option></select><label for="cc">Cc (comma-separated)</label><input id="cc" name="cc" type="email" multiple><label for="bcc">Bcc (comma-separated)</label><input id="bcc" name="bcc" type="email" multiple><label for="files">Attachments</label><input id="files" type="file" name="files" multiple></details>
<div class="actions"><button name="action" value="draft">Save draft</button>{% if send %}<button name="action" value="send" class="primary">Send email</button>{% endif %}</div></form>{% endblock %}
